# Docker publishes the container through the host port mapping, so the service
# inside the container must listen on all interfaces.
- id: webserver
  config:
    host: 0.0.0.0
    port: !!js ctx.webStartup.port ?? 3080

- id: web-runtime
  config:
    printUrl: true
    surfaceContext: true
    trustedHosts: !!js ['localhost', '127.0.0.1', ...ctx.webStartup.trustedHosts]
