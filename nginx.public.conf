# dsh-nginx-template v3
# dsh-nginx-mode public
worker_processes auto;
pid /tmp/dsh-nginx/nginx.pid;
error_log /dev/stderr info;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  client_max_body_size 1000m;
  client_body_temp_path /tmp/dsh-nginx/client_temp;
  proxy_temp_path /tmp/dsh-nginx/proxy_temp;
  fastcgi_temp_path /tmp/dsh-nginx/fastcgi_temp;
  uwsgi_temp_path /tmp/dsh-nginx/uwsgi_temp;
  scgi_temp_path /tmp/dsh-nginx/scgi_temp;

  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_request_buffering off;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 0.0.0.0:3080;
    server_name _;

    # Public authority mode. DSH must be started with --trusted-host matching
    # the browser-facing authority, and every route must preserve the same
    # Host/Origin/Sec-Fetch-Site values so the session cookie authority remains
    # consistent across document and API requests.
    proxy_set_header Host $http_host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location / {
      proxy_pass http://127.0.0.1:13080;
    }
  }
}
